# golangci-lint configuration
version: v1

run:
  timeout: 5m
  tests: true

linters:
  enable-all: false
  enable:
    - gofmt
    - govet
    - staticcheck
    - ineffassign
    - gosimple
    - unused
  disable:
    - errcheck  # TODO: Enable after fixing error handling

linters-settings:
  staticcheck:
    checks: ["all"]

issues:
  exclude-rules:
    # Exclude some linters from running on tests files.
    - path: _test\.go
      linters:
        - errcheck