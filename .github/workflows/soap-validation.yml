name: SOAP Request Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'pkg/generator/**'
      - 'pkg/testing/**'
      - 'soap/**'
      - 'test_fixtures/**'
      - '.github/workflows/soap-validation.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  soap-validation:
    name: SOAP Request Validation
    runs-on: ubuntu-latest
    # Skip job if PR is draft or has WIP in title
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, 'WIP'))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Download go modules
        run: go mod download

      - name: Validate Test Fixtures Structure
        run: |
          echo "🔍 Validating test fixtures structure..."
          
          # Check for required fixture directories
          if [ ! -d "test_fixtures/document_literal" ]; then
            echo "❌ Missing document_literal fixtures directory"
            exit 1
          fi
          
          if [ ! -d "test_fixtures/rpc_literal" ]; then
            echo "❌ Missing rpc_literal fixtures directory"
            exit 1
          fi
          
          # Count fixture files
          DOC_FIXTURES=$(find test_fixtures/document_literal -name "*.wsdl" | wc -l)
          RPC_FIXTURES=$(find test_fixtures/rpc_literal -name "*.wsdl" | wc -l)
          
          echo "📊 Found $DOC_FIXTURES document literal fixtures"
          echo "📊 Found $RPC_FIXTURES RPC literal fixtures"
          
          if [ $DOC_FIXTURES -eq 0 ] && [ $RPC_FIXTURES -eq 0 ]; then
            echo "⚠️  No WSDL fixtures found - SOAP validation will be limited"
          else
            echo "✅ Test fixtures structure validated"
          fi

      - name: Run SOAP Request Framework Tests
        run: |
          echo "🧪 Running SOAP request testing framework tests..."
          go test -v ./pkg/testing -run "TestSOAPCapture|TestXMLComparator|TestExtractOperationName"
          echo "✅ Framework tests completed"

      - name: Run Fixture-Based SOAP Tests
        id: fixture-tests
        run: |
          echo "📋 Running fixture-based SOAP request tests..."
          
          # Capture test output
          TEST_OUTPUT=$(go test -v ./pkg/testing -run TestSOAPRequestFixtures 2>&1) || TEST_FAILED=1
          
          echo "$TEST_OUTPUT"
          
          # Extract fixture count from output
          FIXTURE_COUNT=$(echo "$TEST_OUTPUT" | grep -o "Loaded [0-9]* fixtures" | grep -o "[0-9]*" || echo "0")
          
          echo "fixture_count=$FIXTURE_COUNT" >> $GITHUB_OUTPUT
          
          if [ "${TEST_FAILED:-0}" -eq 1 ]; then
            echo "❌ Fixture tests failed"
            exit 1
          else
            echo "✅ All $FIXTURE_COUNT fixture tests passed"
          fi

      - name: Run SOAP Compliance Validation
        id: compliance-tests
        run: |
          echo "🔒 Running SOAP compliance rule validation..."
          
          # Run compliance tests and capture output
          COMPLIANCE_OUTPUT=$(go test -v -tags=integration ./pkg/testing -run TestRuleEngineWithKnownIssues 2>&1) || COMPLIANCE_FAILED=1
          
          echo "$COMPLIANCE_OUTPUT"
          
          # Count rule violations caught
          ERROR_COUNT=$(echo "$COMPLIANCE_OUTPUT" | grep -c "Error \[.*\]:" || echo "0")
          RULE_TESTS=$(echo "$COMPLIANCE_OUTPUT" | grep -c "=== RUN.*RPC\|Document\|Missing\|Empty" || echo "0")
          
          echo "rule_tests=$RULE_TESTS" >> $GITHUB_OUTPUT
          echo "errors_caught=$ERROR_COUNT" >> $GITHUB_OUTPUT
          
          if [ "${COMPLIANCE_FAILED:-0}" -eq 1 ]; then
            echo "❌ Compliance validation failed"
            exit 1
          else
            echo "✅ All $RULE_TESTS compliance tests passed, caught $ERROR_COUNT expected errors"
          fi

      - name: Run Integration Tests
        run: |
          echo "🔗 Running comprehensive SOAP validation integration tests..."
          go test -v -tags=integration ./pkg/testing -run TestComprehensiveSOAPValidation
          echo "✅ Integration tests completed"

      - name: Test RPC Namespace Issue Detection
        run: |
          echo "🎯 Testing RPC namespace issue detection (regression test)..."
          go test -v -tags=integration ./pkg/testing -run TestFixtureValidationIntegration
          echo "✅ RPC namespace regression test passed"

      - name: Generate SOAP Validation Report
        if: always()
        run: |
          echo "📊 Generating SOAP validation report..."
          
          cat > soap-validation-report.md << 'EOF'
          # SOAP Request Validation Report
          
          ## 📋 Test Results Summary
          
          - **Fixture Tests**: ${{ steps.fixture-tests.outputs.fixture_count || '0' }} fixtures tested
          - **Compliance Rules**: ${{ steps.compliance-tests.outputs.rule_tests || '0' }} rule tests executed  
          - **Errors Detected**: ${{ steps.compliance-tests.outputs.errors_caught || '0' }} compliance violations caught
          
          ## 🔍 What This Validates
          
          ✅ **SOAP XML Generation** - Validates actual SOAP requests generated from WSDL  
          ✅ **RPC vs Document Style** - Tests both binding styles with dedicated fixtures  
          ✅ **Namespace Handling** - Catches namespace prefix issues like `<tns:operation>` vs `<operation xmlns="...">`  
          ✅ **SOAP Compliance** - Validates against SOAP envelope standards  
          ✅ **Regression Prevention** - Prevents the RPC namespace issue from reoccurring  
          
          ## 🛡️ Validation Rules Applied
          
          - **RPC Operation Wrapper Rule** - Ensures correct namespace usage in RPC operations
          - **Document Style Rule** - Validates element-based messages without operation wrappers  
          - **Namespace Consistency Rule** - Checks namespace prefix declarations
          - **SOAP Envelope Rule** - Validates basic SOAP structure and namespaces
          - **Required Elements Rule** - Checks for empty bodies and missing elements
          
          ## 🎯 Issue Prevention
          
          This validation would have caught:
          - The recent RPC namespace issue (`<tns:information>` vs `<information xmlns="...">`)
          - Missing SOAP envelope elements
          - Incorrect namespace declarations
          - Empty SOAP bodies
          - Operation wrapper issues
          
          Generated on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
          
          echo "✅ SOAP validation report generated"

      - name: Upload SOAP Validation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soap-validation-report
          path: soap-validation-report.md
          retention-days: 7

      - name: Comment SOAP Validation Results on PR
        if: github.event_name == 'pull_request' && always()
        uses: thollander/actions-comment-pull-request@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: soap-validation
          pr-number: ${{ github.event.pull_request.number }}
          message: |
            ## 🧼 SOAP Request Validation Results
            
            **Fixture Tests**: ${{ steps.fixture-tests.outputs.fixture_count || '0' }} fixtures validated ✅  
            **Compliance Rules**: ${{ steps.compliance-tests.outputs.rule_tests || '0' }} rule tests executed ✅  
            **Violations Detected**: ${{ steps.compliance-tests.outputs.errors_caught || '0' }} expected errors caught ✅
            
            ### What was validated:
            - SOAP XML generation from WSDL files
            - RPC vs Document style binding compliance  
            - Namespace handling (prevents `<tns:operation>` issues)
            - SOAP envelope structure and standards
            - Regression prevention for known issues
            
            ### Validation Rules Applied:
            - ✅ RPC Operation Wrapper Rule
            - ✅ Document Style Rule  
            - ✅ Namespace Consistency Rule
            - ✅ SOAP Envelope Structure Rule
            - ✅ Required Elements Rule
            
            This testing framework ensures SOAP protocol compliance and prevents issues like the recent RPC namespace problem from reaching production.
            
            <details>
            <summary>📊 Full validation report available in artifacts</summary>
            
            Download the complete SOAP validation report from the workflow artifacts for detailed analysis.
            </details>

  soap-compatibility-matrix:
    name: SOAP Compatibility Matrix
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, 'WIP'))
    
    strategy:
      matrix:
        soap-style: [document, rpc]
        wsdl-version: ["1.1", "2.0"]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Test SOAP Style - ${{ matrix.soap-style }} WSDL ${{ matrix.wsdl-version }}
        run: |
          echo "🔬 Testing ${{ matrix.soap-style }} style SOAP with WSDL ${{ matrix.wsdl-version }}"
          
          # Run style-specific tests
          if [ "${{ matrix.soap-style }}" = "rpc" ]; then
            echo "Testing RPC-style SOAP operations..."
            go test -v ./pkg/testing -run ".*[Rr][Pp][Cc].*"
          else
            echo "Testing Document-style SOAP operations..."  
            go test -v ./pkg/testing -run ".*[Dd]ocument.*"
          fi
          
          echo "✅ ${{ matrix.soap-style }} style validation completed"